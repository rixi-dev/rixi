[package]
name = "rixi"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "A terminal-first Linux rice manager for applying, sharing, and rolling back desktop themes"
repository = "https://github.com/rixi-dev/rixi"
homepage = "https://github.com/rixi-dev"
readme = "README.md"
keywords = ["linux", "rice", "dotfiles", "desktop", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
colored = "3"
thiserror = "2"
whoami = "1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
base64 = "0.21"
serde_json = "1.0"
